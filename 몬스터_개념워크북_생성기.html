<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몬스터 수학개념워크북 생성기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" onload="onKatexLoad()"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#ececee;
    font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
    color:#111;
    padding:24px 0;
  }

  /* ===== 상단 조작 바 (인쇄 시 사라짐) ===== */
  .toolbar { max-width:760px; margin:0 auto 20px; text-align:center; }
  .toolbar button {
    background:#333; color:#fff; border:none; border-radius:6px;
    padding:11px 26px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .toolbar p { margin-top:8px; font-size:13px; color:#666; }

  /* ===== 한 장(A4) ===== */
  .sheet {
    width:760px; min-height:1074px; background:#fff; margin:0 auto 28px;
    padding:36px 40px; box-shadow:0 3px 14px rgba(0,0,0,.10);
  }

  /* ===== 머리글 ===== */
  .head { display:flex; border:2px solid #222; margin-bottom:14px; }
  .head-grade { width:118px; display:flex; flex-direction:column; flex-shrink:0; border-right:2px solid #222; }
  .head-grade .g1 { background:#EBA23C; color:#fff; font-weight:800; text-align:center;
    padding:9px 0; font-size:17px; border-bottom:2px solid #222; }
  .head-grade .g2 { text-align:center; padding:9px 0; font-size:16px; font-weight:700; }
  .head-title { flex:1; background:#F7EAC5; display:flex; align-items:center; justify-content:center; }
  .head-title h1 { font-size:33px; font-weight:900; letter-spacing:3px; color:#2e2712; }
  .head-logo { width:118px; flex-shrink:0; border-left:2px solid #222;
    display:flex; align-items:center; justify-content:center; padding:6px; }
  .logo-badge {
    width:80px; height:80px; border-radius:50%; background:#F26522;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:15px; letter-spacing:1px;
  }

  /* ===== 본문 표 ===== */
  table.main { width:100%; border-collapse:collapse; }
  table.main td { border:1.5px solid #222; padding:0; vertical-align:middle; }
  .lbl { width:70px; text-align:center; font-weight:800; font-size:15px; }
  .unit-cell { padding:11px 14px !important; font-size:16px; font-weight:700; }
  .unit-cell.sub { font-weight:500; color:#333; }

  .kw-cell { padding:0 !important; }
  .kw-grid { display:grid; grid-template-columns:repeat(4,1fr); }
  .kw-grid div {
    border-right:1px solid #ccc; border-bottom:1px solid #ccc;
    text-align:center; padding:10px 4px; font-size:14px; color:#333;
  }
  .kw-grid div:nth-child(4n){ border-right:none; }
  .kw-grid div:nth-child(n+5){ border-bottom:none; }

  .body-lbl { width:70px; text-align:center; font-weight:800; font-size:16px; }
  .body-cell { padding:16px 16px !important; }
  .qnum { font-size:15px; font-weight:800; margin-bottom:5px; }
  .qtext { font-size:14.5px; line-height:1.75; margin-bottom:16px; padding-left:4px; }
  .qtext .math { font-family:'Times New Roman',serif; font-style:italic; font-size:16px; }
  .math { font-family:'Times New Roman',serif; font-style:italic; font-size:16px; }

  /* 빈칸 : 교재식 검정 밑줄/네모 */
  .blank { display:inline-block; min-width:56px; border-bottom:1.6px solid #111;
    height:20px; vertical-align:bottom; }
  .blank.sm { min-width:36px; }
  .box-blank { display:inline-block; width:34px; height:26px; border:1.4px solid #111;
    border-radius:3px; vertical-align:middle; }

  /* 수식 (KaTeX) */
  .katex { font-size: 1.06em; }
  .formula-line { padding: 2px 4px 14px; font-size: 15px; }

  /* 인터넷 없을 때 안내 */
  .offline-note { background:#FFF6DF; border:1.5px solid #EBA23C; color:#5a4300;
    font-size:13px; padding:8px 14px; border-radius:6px;
    max-width:760px; margin:0 auto 14px; text-align:center; }

  /* 그래프 라벨 */
  .g-label { fill:#fff; stroke:#222; stroke-width:1.2; }
  .g-txt { font-size:12px; font-weight:600; fill:#111; }

  /* 정의표 */
  table.def { width:100%; border-collapse:collapse; margin-top:6px; }
  table.def th, table.def td { border:1.2px solid #333; padding:8px 10px; font-size:13.5px; }
  table.def th { background:#EFEFEF; font-weight:700; }
  table.def td.term { text-align:center; font-weight:700; width:110px; background:#FBFBFB; }

  .guide { font-size:12.5px; color:#555; margin:6px 0 10px; }
  .write-lines { margin-top:8px; }
  .write-lines div { border-bottom:1.2px dotted #aaa; height:30px; }

  /* ============================================================
     앱 화면 (목록 / 편집) — 인쇄 시에는 모두 사라짐
     ============================================================ */
  .view[hidden] { display:none; }

  .appbar { max-width:1280px; margin:0 auto 16px; display:flex; gap:10px; align-items:center; padding:0 20px; flex-wrap:wrap; }
  .appbar .grow { flex:1; }
  .appbar h2 { font-size:20px; font-weight:800; }

  .btn { background:#333; color:#fff; border:none; border-radius:6px;
    padding:9px 18px; font-size:14px; font-weight:700; cursor:pointer; }
  .btn.orange { background:#F26522; }
  .btn.line { background:#fff; color:#333; border:1.5px solid #bbb; }
  .btn.small { padding:5px 10px; font-size:12.5px; }
  .btn:disabled { opacity:.45; cursor:default; }

  .status-msg { font-size:13.5px; color:#0a7a2f; font-weight:700; }
  .status-msg.warn { color:#c0392b; }

  /* --- 목록 화면 --- */
  .list-wrap { max-width:900px; margin:0 auto; padding:0 20px; }
  .card { background:#fff; border:1.5px solid #ccc; border-radius:8px;
    padding:16px 18px; margin-bottom:12px; display:flex; align-items:center; gap:14px; }
  .card .c-badge { background:#F7EAC5; border:1.5px solid #EBA23C; border-radius:6px;
    font-size:12.5px; font-weight:800; padding:4px 8px; white-space:nowrap; }
  .card .c-info { flex:1; min-width:0; }
  .card .c-title { font-size:16px; font-weight:800; }
  .card .c-sub { font-size:13px; color:#666; margin-top:2px; }
  .card .c-btns { display:flex; gap:6px; flex-wrap:wrap; }
  .empty-note { text-align:center; color:#777; font-size:14px; padding:40px 0; }

  /* --- 편집 화면 --- */
  .edit-cols { max-width:1280px; margin:0 auto; padding:0 20px;
    display:flex; gap:18px; align-items:flex-start; }
  .edit-left { flex:1; min-width:430px; }
  .edit-right { width:560px; flex-shrink:0; }

  .panel { background:#fff; border:1.5px solid #ccc; border-radius:8px; padding:16px; margin-bottom:14px; }
  .panel-title { font-size:15px; font-weight:800; margin-bottom:12px; }

  .frow { display:flex; gap:10px; margin-bottom:10px; align-items:center; }
  .frow label { width:64px; font-size:13.5px; font-weight:700; flex-shrink:0; }
  .frow input[type=text], .frow select {
    flex:1; border:1.5px solid #bbb; border-radius:5px; padding:8px 10px; font-size:14px;
    font-family:inherit; min-width:0; }
  .frow input:focus, .frow select:focus { outline:none; border-color:#F26522; }
  .fhint { font-size:12px; color:#888; margin:-4px 0 10px 74px; }

  /* 빈칸 도구 */
  .blank-tools { background:#FFF6EF; border:1.5px solid #F26522; border-radius:8px;
    padding:12px 14px; margin-bottom:14px; position:sticky; top:8px; z-index:5; }
  .blank-tools .bt-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .blank-tools p { font-size:12.5px; color:#555; margin-top:8px; line-height:1.5; }

  /* 블록 카드 */
  .blk { border:1.5px solid #ccc; border-radius:8px; margin-bottom:12px; overflow:hidden; }
  .blk-head { background:#F4F4F4; border-bottom:1.5px solid #ccc; padding:8px 12px;
    display:flex; align-items:center; gap:8px; }
  .blk-head .b-type { font-size:13px; font-weight:800; flex:1; }
  .blk-body { padding:12px; }
  .blk textarea { width:100%; border:1.5px solid #bbb; border-radius:5px; padding:9px 10px;
    font-size:14px; font-family:inherit; line-height:1.7; resize:vertical; }
  .blk textarea:focus { outline:none; border-color:#F26522; }
  .blk input[type=text], .blk input[type=number] { border:1.5px solid #bbb; border-radius:5px;
    padding:7px 9px; font-size:13.5px; font-family:inherit; }
  .blk input:focus { outline:none; border-color:#F26522; }
  .blk .brow { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .blk .brow label { font-size:12.5px; font-weight:700; width:110px; flex-shrink:0; color:#444; }
  .blk .brow input[type=text] { flex:1; min-width:0; }
  .blk .brow input[type=number] { width:64px; }
  .blk .figure-note { font-size:13px; color:#666; line-height:1.6; }
  .trow { display:flex; gap:6px; margin-bottom:6px; }
  .trow input.t-term { width:110px; flex-shrink:0; }
  .trow input.t-meaning { flex:1; min-width:0; }

  .add-btns { display:flex; gap:8px; }

  /* 미리보기 */
  .stage-tabs { display:flex; gap:6px; margin-bottom:10px; }
  .stage-tabs button { flex:1; background:#fff; border:1.5px solid #bbb; border-radius:6px;
    padding:9px 0; font-size:13.5px; font-weight:700; cursor:pointer; color:#555; }
  .stage-tabs button.on { background:#333; border-color:#333; color:#fff; }
  #preview-box { background:#d8d8dc; border:1.5px solid #bbb; border-radius:8px;
    overflow:auto; height:calc(100vh - 150px); min-height:420px; padding:14px; }
  #preview-scale { transform:scale(0.68); transform-origin:top left; width:760px; }
  #preview-scale .sheet { margin:0; box-shadow:0 2px 8px rgba(0,0,0,.15); }

  @media print {
    body { background:#fff; padding:0; }
    .toolbar, .appbar, #view-list, #view-edit, .offline-note { display:none !important; }
    .sheet { box-shadow:none; margin:0; width:auto; min-height:auto; page-break-after:always; }
    @page { size:A4; margin:12mm; }
  }
</style>
</head>
<body>

<div id="offline-note" class="offline-note" hidden>
  인터넷 연결이 없어 수식이 교과서 수식 모양으로 보이지 않을 수 있습니다.
  인터넷을 연결한 뒤 새로고침하면 정상 표시됩니다.
</div>

<!-- ================= 화면 1 : 개념 목록 ================= -->
<div id="view-list" class="view">
  <div class="appbar">
    <h2>몬스터 수학개념워크북 생성기</h2>
    <span class="grow"></span>
    <button class="btn orange" id="btn-new">새 개념 만들기</button>
  </div>
  <div class="list-wrap" id="concept-cards"></div>
</div>

<!-- ================= 화면 2 : 개념 편집 ================= -->
<div id="view-edit" class="view" hidden>
  <div class="appbar">
    <button class="btn line" id="btn-back">목록으로</button>
    <span class="status-msg" id="edit-status"></span>
    <span class="grow"></span>
    <button class="btn orange" id="btn-save">저장</button>
    <button class="btn" id="btn-print-cur">인쇄 / PDF</button>
  </div>

  <div class="edit-cols">
    <div class="edit-left">

      <div class="panel">
        <div class="panel-title">기본 정보</div>
        <div class="frow">
          <label>학교</label>
          <select id="f-school"><option>초등학교</option><option>중학교</option><option>고등학교</option></select>
          <label style="width:44px;">학년</label>
          <select id="f-grade"></select>
        </div>
        <div class="frow"><label>대단원</label><input type="text" id="f-unitbig" placeholder="예: 분수와 소수"></div>
        <div class="frow"><label>중단원</label><input type="text" id="f-unitmid" placeholder="예: 분수의 의미"></div>
        <div class="frow"><label>키워드</label><input type="text" id="f-keywords" placeholder="쉼표(,)로 구분. 예: 분수, 분모, 분자"></div>
        <div class="fhint">키워드는 세 장 모두의 키워드 칸에 그대로 들어갑니다. (최대 8개 권장)</div>
      </div>

      <div class="blank-tools">
        <div class="bt-row">
          <button class="btn orange" id="btn-blank">선택한 부분 빈칸 지정</button>
          <button class="btn line" id="btn-unblank">빈칸 해제</button>
        </div>
        <p>본문이나 표에서 빈칸으로 만들 단어를 <b>마우스로 선택(드래그)</b>한 뒤 [빈칸 지정]을 누르세요.
        지정된 단어는 <b>{{ }}</b> 로 표시되며, 1단계에서는 굵은 글씨, 2단계에서는 빈칸이 됩니다.</p>
      </div>

      <div class="panel">
        <div class="panel-title">내용 블록</div>
        <div id="block-list"></div>
        <div class="add-btns">
          <button class="btn line" id="btn-add-text">+ 설명 문단</button>
          <button class="btn line" id="btn-add-formula">+ 수식</button>
          <button class="btn line" id="btn-add-table">+ 용어 정리표</button>
        </div>
      </div>

    </div>

    <div class="edit-right">
      <div class="stage-tabs">
        <button data-stage="1" class="on">1단계 개념 정리</button>
        <button data-stage="2">2단계 빈칸 채우기</button>
        <button data-stage="3">3단계 백지 TEST</button>
      </div>
      <div id="preview-box"><div id="preview-scale"></div></div>
    </div>
  </div>
</div>

<!-- ================= 화면 3 : 인쇄 ================= -->
<div id="view-print" class="view" hidden>
  <div class="toolbar">
    <button onclick="window.print()">인쇄 / PDF 저장</button>
    <button class="btn line" id="btn-print-back" style="margin-left:8px;">돌아가기</button>
    <p>인쇄 미리보기에서 A4 3장으로 나뉘는 것을 확인한 뒤 인쇄하세요.</p>
  </div>
  <div id="print-sheets"></div>
</div>

<script>
/* ============================================================
   몬스터 수학개념워크북 생성기
   1단계: 렌더링 엔진 (개념 JSON 1개 → 3장 자동 파생)
   2단계: 개념 목록 / 편집 화면 / 빈칸 드래그 지정 / 저장
   ============================================================ */

/* ---------- 예제 데이터: 일차함수 (샘플 v2 재현용) ---------- */
const EXAMPLE_CONCEPT = {
  id: "mid2-linear-func-01",
  school: "중학교",
  grade: "2학년",
  unit_big: "일차함수",
  unit_mid: "일차함수와 그래프",
  keywords: ["일차함수", "기울기", "y절편", "x절편", "평행이동", "그래프"],
  blocks: [
    {
      type: "text",
      heading: { "1": "1. 일차함수란?" },
      body: "함수 $y = f(x)$ 에서 $y$가 $x$에 대한 일차식 $y = \\bk{a}x + \\bk{b}$ $(a ≠ 0)$ 로 나타내어질 때, 이 함수를 {{일차함수}}라고 한다.",
      stage3: { mode: "lines", lines: 2 }
    },
    {
      type: "figure",
      figure_type: "coord_graph",
      heading: {
        "1": "2. 일차함수 $y = ax + b$ 의 그래프",
        "2": "2. 일차함수 $y = ax + b$ 의 그래프 : 빈 라벨을 채우시오",
        "3": "2. 아래 그래프에 기울기, y절편, x절편을 직접 표시하고 설명하시오."
      },
      params: { slope: 1, yIntercept: -1, unit: 40 },
      labels: [
        { text: "y절편 b", anchor: "y_intercept", blank: true, box: { x: 150, y: 150, w: 58 } },
        { text: "x절편",   anchor: "x_intercept", blank: true, box: { x: 268, y: 92,  w: 58 } },
        { text: "기울기 a", anchor: "on_line",     blank: true, box: { x: 300, y: 150, w: 72 } }
      ],
      stage3: "axes_only"
    },
    {
      type: "table",
      heading: { "3": "3. 용어 정리" },
      columns: ["용어", "의미"],
      rows: [
        { term: "{{기울기}}", meaning: "$x$의 증가량에 대한 $y$의 증가량의 비율. $y=ax+b$ 에서 $\\bk{a}$" },
        { term: "{{y절편}}", meaning: "그래프가 $y$축과 만나는 점의 $y$좌표. $y=ax+b$ 에서 $\\bk{b}$" },
        { term: "{{x절편}}", meaning: "그래프가 $x$축과 만나는 점의 {{$x$}}좌표" }
      ]
    }
  ]
};

/* ---------- 예제 데이터: 수식 검수용 (분수·루트 포함) ---------- */
const FORMULA_EXAMPLE = {
  id: "example-formula-01",
  school: "중학교",
  grade: "3학년",
  unit_big: "실수와 그 연산",
  unit_mid: "제곱근과 실수 (수식 예제)",
  keywords: ["제곱근", "근호", "루트", "분수"],
  blocks: [
    {
      type: "text",
      heading: { "1": "1. 제곱근이란?" },
      body: "어떤 수 $x$를 제곱하여 $a$가 될 때, 즉 $x^2 = \\bk{a}$ 일 때, $x$를 $a$의 {{제곱근}}이라고 한다. 양수 $a$의 제곱근은 양수와 음수 2개가 있다.",
      stage3: { mode: "lines", lines: 2 }
    },
    {
      type: "formula",
      heading: { "1": "2. 제곱근의 성질" },
      latex: "\\sqrt{a^2} = |a|, \\quad \\sqrt{\\dfrac{1}{4}} = \\bk{\\dfrac{1}{2}}, \\quad \\pm\\sqrt{2}",
      stage3: { mode: "lines", lines: 2 }
    },
    {
      type: "table",
      heading: { "3": "3. 용어 정리" },
      columns: ["용어", "의미"],
      rows: [
        { term: "{{제곱근}}", meaning: "제곱하여 $a$가 되는 수" },
        { term: "{{근호}}", meaning: "기호 $\\sqrt{\\phantom{a}}$. \"루트\"라고 읽는다" }
      ]
    }
  ]
};

/* ============================================================
   1부. 렌더링 엔진 (1단계에서 만든 것 그대로)
   ============================================================ */

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function round1(n) { return Math.round(n * 10) / 10; }

const STAGE_TITLE = { 1: "개념 정리", 2: "빈칸 채우기", 3: "백지 TEST" };
const STAGE3_GUIDE = "키워드만 보고 아는 내용을 모두 적으시오.";

/* ----- 수식 렌더링 (KaTeX, 없으면 단순 표시) ----- */

function katexAvailable() { return typeof katex !== "undefined"; }

// 수식 한 조각을 그리기
function renderMathSeg(tex) {
  if (!tex) return "";
  if (katexAvailable()) {
    try {
      return katex.renderToString(tex, { throwOnError: false });
    } catch (e) {}
  }
  return '<span class="math">' + esc(tex) + "</span>";
}

// \bk{...} 를 찾아 [일반, 빈칸내용, 일반, 빈칸내용, ...] 로 쪼개기 (중괄호 짝 맞춰서)
function splitBk(src) {
  const parts = [];
  let start = 0, i = 0;
  while (true) {
    const k = src.indexOf("\\bk{", i);
    if (k < 0) break;
    let depth = 1, j = k + 4;
    while (j < src.length && depth > 0) {
      if (src[j] === "{") depth++;
      else if (src[j] === "}") depth--;
      j++;
    }
    parts.push(src.slice(start, k));
    parts.push(src.slice(k + 4, depth === 0 ? j - 1 : j));
    start = j; i = j;
  }
  parts.push(src.slice(start));
  return parts;
}

// $...$ 안쪽 내용 렌더링 (\bk 처리 포함)
function renderMathContent(content, stage) {
  const parts = splitBk(content);
  if (stage === 1) {
    return renderMathSeg(parts.join(""));
  }
  let out = "";
  parts.forEach(function (p, i) {
    if (i % 2 === 0) {
      if (p !== "") out += renderMathSeg(p);
    } else {
      // 빈칸 네모: 정답 길이에 비례한 폭 (최소 폭 보장)
      const plainLen = p.replace(/\\[a-zA-Z]+/g, "#").replace(/[{}]/g, "").length;
      const w = Math.max(34, 16 + plainLen * 9);
      out += '<span class="box-blank" style="width:' + w + 'px"></span>';
    }
  });
  return out;
}

// $...$ 구간을 찾아 수식으로, 나머지는 일반 글자로
function renderMathText(src, stage) {
  let out = "", last = 0, m;
  const re = /\$(.+?)\$/g;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += renderMathContent(m[1], stage);
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

// {{...}} 빈칸 처리. ctx: 'text'(설명 문단) | 'cell'(표 의미 칸) | 'term'(표 용어 칸)
function renderBlankable(inner, stage, ctx) {
  const plain = inner.replace(/\$/g, "").replace(/\\bk\{([^}]*)\}/g, "$1");
  if (stage === 1) {
    const body = renderMathText(inner, 1);
    return ctx === "text" ? "<b>" + body + "</b>" : body;
  }
  const sm = ctx === "term" || plain.length <= 2;
  return '<span class="blank' + (sm ? " sm" : "") + '"></span>';
}

// 최상위: {{ }} → 빈칸, 나머지 → 수식/일반 글자
function renderInline(src, stage, ctx) {
  let out = "", last = 0, m;
  const re = /\{\{(.+?)\}\}/g;
  while ((m = re.exec(src))) {
    out += renderMathText(src.slice(last, m.index), stage);
    out += renderBlankable(m[1], stage, ctx || "text");
    last = re.lastIndex;
  }
  out += renderMathText(src.slice(last), stage);
  return out;
}

function headingFor(block, stage) {
  if (!block.heading) return null;
  return block.heading[String(stage)] || block.heading["1"] || null;
}

/* ---------- 그림: coord_graph (좌표평면 + 직선) ---------- */

function clipLineToRect(slope, yIntercept, unit, ox, oy, r) {
  const Yat = function (X) { return oy - slope * (X - ox) - unit * yIntercept; };
  if (slope === 0) {
    const Y = oy - unit * yIntercept;
    if (Y < r.y1 || Y > r.y2) return null;
    return [r.x1, Y, r.x2, Y];
  }
  const Xat = function (Y) { return ox + (oy - unit * yIntercept - Y) / slope; };
  const cand = [
    [r.x1, Yat(r.x1)], [r.x2, Yat(r.x2)],
    [Xat(r.y1), r.y1], [Xat(r.y2), r.y2]
  ];
  const pts = cand.filter(function (p) {
    return p[0] >= r.x1 - 0.01 && p[0] <= r.x2 + 0.01 &&
           p[1] >= r.y1 - 0.01 && p[1] <= r.y2 + 0.01;
  });
  if (pts.length < 2) return null;
  pts.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  const A = pts[0], B = pts[pts.length - 1];
  if (Math.abs(A[0] - B[0]) < 0.01 && Math.abs(A[1] - B[1]) < 0.01) return null;
  return [A[0], A[1], B[0], B[1]];
}

function renderCoordGraph(block, stage) {
  const p = block.params || {};
  const unit = p.unit || 40, ox = 220, oy = 120;
  const slope = p.slope, yIntercept = p.yIntercept;

  if (stage === 3 && block.stage3 === "none") return "";

  let s = '<svg width="100%" viewBox="0 0 420 240" style="margin:6px 0 12px;">';

  s += '<g stroke="#eee" stroke-width="1">';
  for (let gy = 40; gy <= 200; gy += 40) {
    if (gy !== oy) s += '<line x1="20" y1="' + gy + '" x2="400" y2="' + gy + '"/>';
  }
  for (let gx = 60; gx <= 380; gx += 40) {
    if (gx !== ox) s += '<line x1="' + gx + '" y1="20" x2="' + gx + '" y2="220"/>';
  }
  s += "</g>";

  s += '<line x1="20" y1="120" x2="405" y2="120" stroke="#333" stroke-width="1.5"/>';
  s += '<line x1="220" y1="18" x2="220" y2="225" stroke="#333" stroke-width="1.5"/>';
  s += '<text x="410" y="124" class="g-txt">x</text><text x="224" y="20" class="g-txt">y</text>';
  s += '<text x="224" y="134" class="g-txt" font-size="10">O</text>';

  const seg = clipLineToRect(slope, yIntercept, unit, ox, oy, { x1: 20, y1: 18, x2: 405, y2: 240 });
  if (seg) {
    s += '<line x1="' + round1(seg[0]) + '" y1="' + round1(seg[1]) +
         '" x2="' + round1(seg[2]) + '" y2="' + round1(seg[3]) +
         '" stroke="#E8500A" stroke-width="2.5"/>';
  }

  if (stage < 3) {
    (block.labels || []).forEach(function (lb) {
      let dot = null;
      if (lb.anchor === "y_intercept") dot = [ox, oy - unit * yIntercept];
      if (lb.anchor === "x_intercept" && slope !== 0) dot = [ox + unit * (-yIntercept / slope), oy];
      if (dot) s += '<circle cx="' + round1(dot[0]) + '" cy="' + round1(dot[1]) + '" r="3.5" fill="#E8500A"/>';
      const b = lb.box;
      s += '<rect class="g-label" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="22" rx="3"/>';
      if (stage === 1 || !lb.blank) {
        s += '<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + 15) + '" class="g-txt" text-anchor="middle">' + esc(lb.text) + "</text>";
      }
    });
  }

  s += "</svg>";
  return s;
}

function renderFigure(block, stage) {
  if (block.figure_type === "coord_graph") return renderCoordGraph(block, stage);
  return "";
}

/* ---------- 블록별 렌더링 ---------- */

function renderTextBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (stage === 3) {
    const st3 = block.stage3 || { mode: "lines", lines: 2 };
    if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
    if (st3.mode === "lines") {
      out += '<div class="write-lines">';
      for (let i = 0; i < (st3.lines || 2); i++) out += "<div></div>";
      out += "</div>";
    }
    return out;
  }
  if (h) out += '<div class="qnum">' + renderInline(h, 1, "text") + "</div>";
  out += '<div class="qtext">' + renderInline(block.body, stage, "text") + "</div>";
  return out;
}

function renderFormulaBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (stage === 3) {
    const st3 = block.stage3 || { mode: "lines", lines: 2 };
    if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
    if (st3.mode === "lines") {
      out += '<div class="write-lines">';
      for (let i = 0; i < (st3.lines || 2); i++) out += "<div></div>";
      out += "</div>";
    }
    return out;
  }
  if (h) out += '<div class="qnum">' + renderInline(h, 1, "text") + "</div>";
  out += '<div class="formula-line">' + renderMathContent(block.latex || "", stage) + "</div>";
  return out;
}

function renderFigureBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
  out += renderFigure(block, stage);
  return out;
}

function renderTableBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
  out += '<table class="def">';
  out += "<tr><th>" + esc(block.columns[0]) + "</th><th>" + esc(block.columns[1]) + "</th></tr>";
  block.rows.forEach(function (row) {
    if (stage === 3) {
      const termPlain = row.term.replace(/\{\{|\}\}/g, "");
      out += '<tr><td class="term" style="height:32px;">' + renderInline(termPlain, 1, "term") + "</td><td></td></tr>";
    } else {
      out += '<tr><td class="term">' + renderInline(row.term, stage, "term") + "</td>" +
             "<td>" + renderInline(row.meaning, stage, "cell") + "</td></tr>";
    }
  });
  out += "</table>";
  return out;
}

/* ---------- 한 장(sheet) 조립 ---------- */

function renderKeywordGrid(keywords) {
  const total = Math.max(8, Math.ceil(keywords.length / 4) * 4);
  let out = '<div class="kw-grid">';
  for (let i = 0; i < total; i++) {
    out += "<div>" + (keywords[i] ? esc(keywords[i]) : "") + "</div>";
  }
  out += "</div>";
  return out;
}

function renderSheet(c, stage) {
  let out = '<div class="sheet">';

  out += '<div class="head">' +
    '<div class="head-grade"><div class="g1">' + esc(c.school) + '</div><div class="g2">' + esc(c.grade) + "</div></div>" +
    '<div class="head-title"><h1>' + STAGE_TITLE[stage] + "</h1></div>" +
    '<div class="head-logo"><div class="logo-badge">더몬스터</div></div>' +
    "</div>";

  out += '<table class="main">';
  out += '<tr><td class="lbl">대단원</td><td class="unit-cell">' + esc(c.unit_big) + "</td></tr>";
  out += '<tr><td class="lbl">중단원</td><td class="unit-cell sub">' + esc(c.unit_mid) + "</td></tr>";
  out += '<tr><td class="lbl">키워드</td><td class="kw-cell">' + renderKeywordGrid(c.keywords) + "</td></tr>";

  out += '<tr><td class="body-lbl">' + (stage === 3 ? "TEST" : "개념") + '</td><td class="body-cell">';
  if (stage === 3) out += '<div class="guide">' + esc(STAGE3_GUIDE) + "</div>";

  let prevWasLines = false;
  c.blocks.forEach(function (block) {
    const opt = { marginTop: stage === 3 && prevWasLines };
    if (block.type === "text") out += renderTextBlock(block, stage, opt);
    else if (block.type === "formula") out += renderFormulaBlock(block, stage, opt);
    else if (block.type === "figure") out += renderFigureBlock(block, stage, opt);
    else if (block.type === "table") out += renderTableBlock(block, stage, opt);
    prevWasLines = stage === 3 && (block.type === "text" || block.type === "formula");
  });

  out += "</td></tr></table></div>";
  return out;
}

function renderConcept(c) {
  return [1, 2, 3].map(function (stage) { return renderSheet(c, stage); }).join("\n");
}

   2부. 개념 은행 (저장/불러오기)
   ============================================================ */

const STORE_KEY = "monster_workbook_concepts_v1";

function loadConcepts() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}

function saveConcepts(list) {
  localStorage.setItem(STORE_KEY, JSON.stringify(list));
}

let concepts = loadConcepts();
if (!concepts) {
  concepts = [JSON.parse(JSON.stringify(EXAMPLE_CONCEPT))];
  saveConcepts(concepts);
}

if (!localStorage.getItem("mw_seed_formula_v1")) {
  if (!concepts.some(function (c) { return c.id === FORMULA_EXAMPLE.id; })) {
    concepts.push(JSON.parse(JSON.stringify(FORMULA_EXAMPLE)));
    saveConcepts(concepts);
  }
  localStorage.setItem("mw_seed_formula_v1", "1");
}

let prevView = "view-list";

function showView(id) {
  ["view-list", "view-edit", "view-print"].forEach(function (v) {
    document.getElementById(v).hidden = (v !== id);
  });
  window.scrollTo(0, 0);
}

/* ============================================================
   4부. 개념 목록 화면
   ============================================================ */

function conceptTitle(c) {
  return c.unit_mid || c.unit_big || "(제목 없음)";
}

function renderList() {
  const wrap = document.getElementById("concept-cards");
  if (!concepts.length) {
    wrap.innerHTML = '<div class="empty-note">저장된 개념이 없습니다. [새 개념 만들기]를 눌러 시작하세요.</div>';
    return;
  }
  wrap.innerHTML = concepts.map(function (c, i) {
    return '<div class="card">' +
      '<span class="c-badge">' + esc(c.school + " " + c.grade) + "</span>" +
      '<div class="c-info">' +
        '<div class="c-title">' + esc(conceptTitle(c)) + "</div>" +
        '<div class="c-sub">대단원: ' + esc(c.unit_big || "-") + "</div>" +
      "</div>" +
      '<div class="c-btns">' +
        '<button class="btn small" data-act="edit" data-i="' + i + '">편집</button>' +
        '<button class="btn small line" data-act="print" data-i="' + i + '">인쇄</button>' +
        '<button class="btn small line" data-act="copy" data-i="' + i + '">복제</button>' +
        '<button class="btn small line" data-act="del" data-i="' + i + '">삭제</button>' +
      "</div></div>";
  }).join("");
}

document.getElementById("concept-cards").addEventListener("click", function (e) {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  const i = Number(btn.dataset.i);
  const act = btn.dataset.act;
  if (act === "edit") openEditor(concepts[i]);
  else if (act === "print") openPrint(concepts[i], "view-list");
  else if (act === "copy") {
    const dup = JSON.parse(JSON.stringify(concepts[i]));
    dup.id = "c" + Date.now();
    dup.unit_mid = (dup.unit_mid || "") + " (복사본)";
    concepts.splice(i + 1, 0, dup);
    saveConcepts(concepts);
    renderList();
  } else if (act === "del") {
    if (confirm('"' + conceptTitle(concepts[i]) + '" 개념을 삭제할까요? 되돌릴 수 없습니다.')) {
      concepts.splice(i, 1);
      saveConcepts(concepts);
      renderList();
    }
  }
});

document.getElementById("btn-new").addEventListener("click", function () {
  openEditor(null);
});

   5부. 개념 편집 화면

let current = null;      // 지금 편집 중인 개념 (복사본)
let dirty = false;       // 저장 안 한 변경이 있는지
let curStage = 1;        // 미리보기 단계
let lastField = null;    // 마지막으로 선택한 입력칸 (빈칸 지정용)
let statusTimer = null;

function setStatus(text, warn) {
  const el = document.getElementById("edit-status");
  el.textContent = text;
  el.className = "status-msg" + (warn ? " warn" : "");
  clearTimeout(statusTimer);
  if (text) statusTimer = setTimeout(function () { el.textContent = ""; }, 3000);
}

function markDirty() {
  dirty = true;
  schedulePreview();
}

function newConceptTemplate() {
  return {
    id: "",
    school: "초등학교",
    grade: "3학년",
    unit_big: "",
    unit_mid: "",
    keywords: [],
    blocks: [
      { type: "text", heading: { "1": "1. " }, body: "", stage3: { mode: "lines", lines: 2 } }
    ]
  };
}

});

});

});
document.getElementById("f-unitmid").addEventListener("input", function () {

});

/* ----- 블록 폼 ----- */

const BLOCK_TYPE_NAME = { text: "설명 문단", table: "용어 정리표", figure: "그림", formula: "수식" };

function renderBlockForms() {
  const wrap = document.getElementById("block-list");
  wrap.innerHTML = "";
  current.blocks.forEach(function (block, idx) {
    wrap.appendChild(buildBlockCard(block, idx));
  });
}

function buildBlockCard(block, idx) {
  const card = document.createElement("div");
  card.className = "blk";

  const head = document.createElement("div");
  head.className = "blk-head";
  head.innerHTML = '<span class="b-type">' + (idx + 1) + ". " + (BLOCK_TYPE_NAME[block.type] || block.type) + "</span>";

  const btnUp = mkBtn("위로", "btn small line");
  const btnDown = mkBtn("아래로", "btn small line");
  const btnDel = mkBtn("삭제", "btn small line");
  btnUp.disabled = idx === 0;
  btnDown.disabled = idx === current.blocks.length - 1;
  btnUp.addEventListener("click", function () { moveBlock(idx, -1); });
  btnDown.addEventListener("click", function () { moveBlock(idx, 1); });
  btnDel.addEventListener("click", function () {
    if (confirm("이 블록을 삭제할까요?")) {
      current.blocks.splice(idx, 1);
      renderBlockForms(); markDirty();
    }
  });
  head.appendChild(btnUp); head.appendChild(btnDown); head.appendChild(btnDel);
  card.appendChild(head);

  const body = document.createElement("div");
  body.className = "blk-body";

  if (block.type === "text") buildTextForm(body, block);
  else if (block.type === "formula") buildFormulaForm(body, block);
  else if (block.type === "table") buildTableForm(body, block);
  else if (block.type === "figure") {
    body.innerHTML = '<div class="figure-note">그림 블록입니다. (종류: 좌표평면 그래프)<br>' +
      "그림 내용을 바꾸는 편집 기능은 4단계에서 추가됩니다. 지금은 미리보기와 인쇄에 그대로 나옵니다.</div>";
  }

  card.appendChild(body);
  return card;
}

function mkBtn(text, cls) {
  const b = document.createElement("button");
  b.textContent = text;
  b.className = cls;
  return b;
}

function mkRow(labelText, inputEl) {
  const row = document.createElement("div");
  row.className = "brow";
  const lab = document.createElement("label");
  lab.textContent = labelText;
  row.appendChild(lab);
  row.appendChild(inputEl);
  return row;
}

function buildTextForm(body, block) {
  // 소제목
  const hIn = document.createElement("input");
  hIn.type = "text";
  hIn.placeholder = "예: 1. 분수란?";
  hIn.value = (block.heading && block.heading["1"]) || "";
  hIn.addEventListener("input", function () {
    if (!block.heading) block.heading = {};
    block.heading["1"] = hIn.value;
    markDirty();
  });
  body.appendChild(mkRow("소제목", hIn));

  // 본문
  const ta = document.createElement("textarea");
  ta.rows = 5;
  ta.className = "blankable";
  ta.placeholder = "개념 설명을 교과서 문체로 입력하세요. 예: 전체를 똑같이 나눈 것 중의 얼마를 나타내는 수를 분수라고 한다.";
  ta.value = block.body || "";
  ta.addEventListener("input", function () {
    block.body = ta.value;
    markDirty();
  });
  body.appendChild(ta);

  // 3단계 설정
  const qIn = document.createElement("input");
  qIn.type = "text";
  qIn.placeholder = "비우면 소제목이 그대로 질문이 됩니다";
  qIn.value = (block.heading && block.heading["3"]) || "";
  qIn.addEventListener("input", function () {
    if (!block.heading) block.heading = {};
    if (qIn.value) block.heading["3"] = qIn.value;
    else delete block.heading["3"];
    markDirty();
  });
  const row1 = mkRow("백지 TEST 질문", qIn);
  row1.style.marginTop = "8px";

function insertSnippet(field, text, selectPart) {
  const s = field.selectionStart, e = field.selectionEnd, v = field.value;
  field.value = v.slice(0, s) + text + v.slice(e);
  let selS = s + text.length, selE = selS;
  if (selectPart) {
    const k = text.indexOf(selectPart);
    if (k >= 0) { selS = s + k; selE = selS + selectPart.length; }
  }
  field.focus();
  field.setSelectionRange(selS, selE);
  field.dispatchEvent(new Event("input", { bubbles: true }));
}

// 수식 칸(\bk{ })의 빈칸 위치 목록 찾기 (중괄호 짝 맞춰서)
function findBkRanges(v) {
  const out = [];
  let i = 0;
  while (true) {
    const k = v.indexOf("\\bk{", i);
    if (k < 0) break;
    let depth = 1, j = k + 4;
    while (j < v.length && depth > 0) {
      if (v[j] === "{") depth++;
      else if (v[j] === "}") depth--;
      j++;
    }
    out.push({ start: k, end: j, inner: v.slice(k + 4, j - 1) });
    i = j;
  }
  return out;
}

document.getElementById("btn-blank").addEventListener("click", function () {
  const f = lastField;
  if (!f || !document.body.contains(f)) {
    setStatus("빈칸으로 만들 단어를 먼저 본문에서 마우스로 선택하세요.", true);
    return;
  }
  const isFormula = f.dataset.marker === "bk";
  let s = f.selectionStart, e2 = f.selectionEnd;
  const v = f.value;
  if (s === e2) {
    setStatus("빈칸으로 만들 단어를 먼저 마우스로 선택(드래그)하세요.", true);
    return;
  }
  while (s < e2 && /\s/.test(v[s])) s++;
  while (e2 > s && /\s/.test(v[e2 - 1])) e2--;
  if (s === e2) { setStatus("빈칸으로 만들 단어를 선택하세요.", true); return; }
  const sel = v.slice(s, e2);

  if (isFormula) {
    // 수식 칸: \bk{ } 로 감싸기
    if (sel.includes("\\bk{")) { setStatus("이미 빈칸으로 지정된 부분이 포함되어 있습니다.", true); return; }
    if (findBkRanges(v).some(function (r) { return s < r.end && e2 > r.start; })) {
      setStatus("이미 빈칸으로 지정된 부분입니다.", true); return;
    }
    let depth = 0;
    for (const ch of sel) {
      if (ch === "{") depth++;
      else if (ch === "}") depth--;
      if (depth < 0) break;
    }
    if (depth !== 0) { setStatus("수식의 묶음이 잘리게 선택되었습니다. 조금 넓게(묶음 전체를) 선택해 보세요.", true); return; }
    f.value = v.slice(0, s) + "\\bk{" + sel + "}" + v.slice(e2);
    f.dispatchEvent(new Event("input", { bubbles: true }));
    f.focus();
    f.setSelectionRange(s, e2 + 5);
  } else {
    if (sel.includes("{{") || sel.includes("}}")) {
      setStatus("이미 빈칸으로 지정된 부분이 포함되어 있습니다.", true);
      return;
    }
    const before = v.slice(0, s);
    if ((before.match(/\{\{/g) || []).length > (before.match(/\}\}/g) || []).length) {
      setStatus("이미 빈칸으로 지정된 부분입니다.", true);
      return;
    }
    f.value = v.slice(0, s) + "{{" + sel + "}}" + v.slice(e2);
    f.dispatchEvent(new Event("input", { bubbles: true }));
    f.focus();
    f.setSelectionRange(s, e2 + 4);
  }
  setStatus('"' + sel + '" 이(가) 빈칸으로 지정되었습니다.');
});

document.getElementById("btn-unblank").addEventListener("click", function () {
  const f = lastField;
  if (!f || !document.body.contains(f)) {
    setStatus("해제할 빈칸이 있는 입력칸을 먼저 클릭하세요.", true);
    return;
  }
  const s = f.selectionStart, e2 = f.selectionEnd;
  const v = f.value;
  let hit = null;

  if (f.dataset.marker === "bk") {
    hit = findBkRanges(v).find(function (r) { return s <= r.end && e2 >= r.start; }) || null;
  } else {
    const re = /\{\{(.+?)\}\}/g;
    let m;
    while ((m = re.exec(v))) {
      if (s <= m.index + m[0].length && e2 >= m.index) {
        hit = { start: m.index, end: m.index + m[0].length, inner: m[1] };
        break;
      }
    }
  }
  if (!hit) {
    setStatus("선택한 위치에 지정된 빈칸이 없습니다. 빈칸 단어를 클릭한 뒤 다시 누르세요.", true);
    return;
  }
  f.value = v.slice(0, hit.start) + hit.inner + v.slice(hit.end);
  f.dispatchEvent(new Event("input", { bubbles: true }));
  f.focus();
  f.setSelectionRange(hit.start, hit.start + hit.inner.length);
  setStatus('"' + hit.inner + '" 빈칸이 해제되었습니다.');
});

    return;

  if (!current.id) current.id = "c" + Date.now();
  const idx = concepts.findIndex(function (c) { return c.id === current.id; });

  if (idx >= 0) concepts[idx] = copy;
  else concepts.push(copy);
  saveConcepts(concepts);
  dirty = false;
  setStatus("저장되었습니다.");
});
