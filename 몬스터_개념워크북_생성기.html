<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>몬스터 수학개념워크북 생성기</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#ececee;
    font-family:'Noto Sans KR','Malgun Gothic','맑은 고딕','Apple SD Gothic Neo',sans-serif;
    color:#111;
    padding:24px 0;
  }

  /* ===== 상단 조작 바 (인쇄 시 사라짐) ===== */
  .toolbar { max-width:760px; margin:0 auto 20px; text-align:center; }
  .toolbar button {
    background:#333; color:#fff; border:none; border-radius:6px;
    padding:11px 26px; font-size:15px; font-weight:700; cursor:pointer;
  }
  .toolbar p { margin-top:8px; font-size:13px; color:#666; }

  /* ===== 한 장(A4) ===== */
  .sheet {
    width:760px; min-height:1074px; background:#fff; margin:0 auto 28px;
    padding:36px 40px; box-shadow:0 3px 14px rgba(0,0,0,.10);
  }

  /* ===== 머리글 ===== */
  .head { display:flex; border:2px solid #222; margin-bottom:14px; }
  .head-grade { width:118px; display:flex; flex-direction:column; flex-shrink:0; border-right:2px solid #222; }
  .head-grade .g1 { background:#EBA23C; color:#fff; font-weight:800; text-align:center;
    padding:9px 0; font-size:17px; border-bottom:2px solid #222; }
  .head-grade .g2 { text-align:center; padding:9px 0; font-size:16px; font-weight:700; }
  .head-title { flex:1; background:#F7EAC5; display:flex; align-items:center; justify-content:center; }
  .head-title h1 { font-size:33px; font-weight:900; letter-spacing:3px; color:#2e2712; }
  .head-logo { width:118px; flex-shrink:0; border-left:2px solid #222;
    display:flex; align-items:center; justify-content:center; padding:6px; }
  .logo-badge {
    width:80px; height:80px; border-radius:50%; background:#F26522;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-weight:900; font-size:15px; letter-spacing:1px;
  }

  /* ===== 본문 표 ===== */
  table.main { width:100%; border-collapse:collapse; }
  table.main td { border:1.5px solid #222; padding:0; vertical-align:middle; }
  .lbl { width:70px; text-align:center; font-weight:800; font-size:15px; }
  .unit-cell { padding:11px 14px !important; font-size:16px; font-weight:700; }
  .unit-cell.sub { font-weight:500; color:#333; }

  .kw-cell { padding:0 !important; }
  .kw-grid { display:grid; grid-template-columns:repeat(4,1fr); }
  .kw-grid div {
    border-right:1px solid #ccc; border-bottom:1px solid #ccc;
    text-align:center; padding:10px 4px; font-size:14px; color:#333;
  }
  .kw-grid div:nth-child(4n){ border-right:none; }
  .kw-grid div:nth-child(n+5){ border-bottom:none; }

  .body-lbl { width:70px; text-align:center; font-weight:800; font-size:16px; }
  .body-cell { padding:16px 16px !important; }
  .qnum { font-size:15px; font-weight:800; margin-bottom:5px; }
  .qtext { font-size:14.5px; line-height:1.75; margin-bottom:16px; padding-left:4px; }
  .qtext .math { font-family:'Times New Roman',serif; font-style:italic; font-size:16px; }
  .math { font-family:'Times New Roman',serif; font-style:italic; font-size:16px; }

  /* 빈칸 : 교재식 검정 밑줄/네모 */
  .blank { display:inline-block; min-width:56px; border-bottom:1.6px solid #111;
    height:20px; vertical-align:bottom; }
  .blank.sm { min-width:36px; }
  .box-blank { display:inline-block; width:34px; height:26px; border:1.4px solid #111;
    border-radius:3px; vertical-align:middle; }

  /* 그래프 라벨 */
  .g-label { fill:#fff; stroke:#222; stroke-width:1.2; }
  .g-txt { font-size:12px; font-weight:600; fill:#111; }

  /* 정의표 */
  table.def { width:100%; border-collapse:collapse; margin-top:6px; }
  table.def th, table.def td { border:1.2px solid #333; padding:8px 10px; font-size:13.5px; }
  table.def th { background:#EFEFEF; font-weight:700; }
  table.def td.term { text-align:center; font-weight:700; width:110px; background:#FBFBFB; }

  .guide { font-size:12.5px; color:#555; margin:6px 0 10px; }
  .write-lines { margin-top:8px; }
  .write-lines div { border-bottom:1.2px dotted #aaa; height:30px; }

  @media print {
    body { background:#fff; padding:0; }
    .toolbar { display:none; }
    .sheet { box-shadow:none; margin:0; width:auto; min-height:auto; page-break-after:always; }
    @page { size:A4; margin:12mm; }
  }
</style>
</head>
<body>

<div class="toolbar">
  <button onclick="window.print()">인쇄 / PDF 저장</button>
  <p>1단계 검수용 화면입니다. 개념 데이터 1개에서 3장(개념 정리 → 빈칸 채우기 → 백지 TEST)이 자동 생성되었습니다.</p>
</div>

<div id="sheets"></div>

<script>
/* ============================================================
   몬스터 수학개념워크북 생성기 — 1단계: 렌더링 엔진
   원본(개념 JSON 1개) → 3장(개념 정리 / 빈칸 채우기 / 백지 TEST) 자동 파생
   ============================================================ */

/* ---------- 예제 데이터: 일차함수 (샘플 v2 재현용) ---------- */
const EXAMPLE_CONCEPT = {
  id: "mid2-linear-func-01",
  school: "중학교",
  grade: "2학년",
  unit_big: "일차함수",
  unit_mid: "일차함수와 그래프",
  keywords: ["일차함수", "기울기", "y절편", "x절편", "평행이동", "그래프"],
  blocks: [
    {
      type: "text",
      heading: { "1": "1. 일차함수란?" },
      body: "함수 $y = f(x)$ 에서 $y$가 $x$에 대한 일차식 $y = \\bk{a}x + \\bk{b}$ $(a ≠ 0)$ 로 나타내어질 때, 이 함수를 {{일차함수}}라고 한다.",
      stage3: { mode: "lines", lines: 2 }
    },
    {
      type: "figure",
      figure_type: "coord_graph",
      heading: {
        "1": "2. 일차함수 $y = ax + b$ 의 그래프",
        "2": "2. 일차함수 $y = ax + b$ 의 그래프 : 빈 라벨을 채우시오",
        "3": "2. 아래 그래프에 기울기, y절편, x절편을 직접 표시하고 설명하시오."
      },
      params: { slope: 1, yIntercept: -1, unit: 40 },
      labels: [
        { text: "y절편 b", anchor: "y_intercept", blank: true, box: { x: 150, y: 150, w: 58 } },
        { text: "x절편",   anchor: "x_intercept", blank: true, box: { x: 268, y: 92,  w: 58 } },
        { text: "기울기 a", anchor: "on_line",     blank: true, box: { x: 300, y: 150, w: 72 } }
      ],
      stage3: "axes_only"
    },
    {
      type: "table",
      heading: { "3": "3. 용어 정리" },
      columns: ["용어", "의미"],
      rows: [
        { term: "{{기울기}}", meaning: "$x$의 증가량에 대한 $y$의 증가량의 비율. $y=ax+b$ 에서 $\\bk{a}$" },
        { term: "{{y절편}}", meaning: "그래프가 $y$축과 만나는 점의 $y$좌표. $y=ax+b$ 에서 $\\bk{b}$" },
        { term: "{{x절편}}", meaning: "그래프가 $x$축과 만나는 점의 {{$x$}}좌표" }
      ]
    }
  ]
};

/* ---------- 공통 유틸 ---------- */
function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function round1(n) { return Math.round(n * 10) / 10; }

const STAGE_TITLE = { 1: "개념 정리", 2: "빈칸 채우기", 3: "백지 TEST" };
const STAGE3_GUIDE = "키워드만 보고 아는 내용을 모두 적으시오.";

/* ---------- 문장 렌더링 ----------
   문법:
   - $...$        : 수식(이탤릭 세리프)으로 표시
   - \bk{...}     : 수식 안 네모 빈칸 (1단계: 내용 표시 / 2단계: 네모)
   - {{...}}      : 낱말 빈칸 (1단계: 굵게 / 2단계: 밑줄 빈칸)
------------------------------------------------------------------ */

// $...$ 안쪽 내용 렌더링 (\bk 처리 포함)
function renderMathContent(content, stage) {
  const parts = content.split(/\\bk\{([^}]*)\}/); // 홀수 인덱스 = 빈칸 내용
  if (stage === 1) {
    return '<span class="math">' + esc(parts.join("")) + "</span>";
  }
  let out = "";
  parts.forEach(function (p, i) {
    if (i % 2 === 0) {
      if (p !== "") out += '<span class="math">' + esc(p) + "</span>";
    } else {
      out += '<span class="box-blank"></span>';
    }
  });
  return out;
}

// $...$ 구간을 찾아 수식으로, 나머지는 일반 글자로
function renderMathText(src, stage) {
  let out = "", last = 0, m;
  const re = /\$(.+?)\$/g;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += renderMathContent(m[1], stage);
    last = re.lastIndex;
  }
  out += esc(src.slice(last));
  return out;
}

// {{...}} 빈칸 처리. ctx: 'text'(설명 문단) | 'cell'(표 의미 칸) | 'term'(표 용어 칸)
function renderBlankable(inner, stage, ctx) {
  const plain = inner.replace(/\$/g, "").replace(/\\bk\{([^}]*)\}/g, "$1");
  if (stage === 1) {
    const body = renderMathText(inner, 1);
    return ctx === "text" ? "<b>" + body + "</b>" : body;
  }
  const sm = ctx === "term" || plain.length <= 2;
  return '<span class="blank' + (sm ? " sm" : "") + '"></span>';
}

// 최상위: {{ }} → 빈칸, 나머지 → 수식/일반 글자
function renderInline(src, stage, ctx) {
  let out = "", last = 0, m;
  const re = /\{\{(.+?)\}\}/g;
  while ((m = re.exec(src))) {
    out += renderMathText(src.slice(last, m.index), stage);
    out += renderBlankable(m[1], stage, ctx || "text");
    last = re.lastIndex;
  }
  out += renderMathText(src.slice(last), stage);
  return out;
}

// 블록 소제목 (단계별로 다른 문구 지원, 항상 전체 내용 표시)
function headingFor(block, stage) {
  if (!block.heading) return null;
  return block.heading[String(stage)] || block.heading["1"] || null;
}

/* ---------- 그림 렌더링: coord_graph (좌표평면 + 직선) ----------
   파라미터(기울기·y절편)만으로 코드가 SVG를 그린다.
------------------------------------------------------------------ */

// 수학 직선을 화면 영역에 맞게 자르기
function clipLineToRect(slope, yIntercept, unit, ox, oy, r) {
  const Yat = function (X) { return oy - slope * (X - ox) - unit * yIntercept; };
  if (slope === 0) {
    const Y = oy - unit * yIntercept;
    if (Y < r.y1 || Y > r.y2) return null;
    return [r.x1, Y, r.x2, Y];
  }
  const Xat = function (Y) { return ox + (oy - unit * yIntercept - Y) / slope; };
  const cand = [
    [r.x1, Yat(r.x1)], [r.x2, Yat(r.x2)],
    [Xat(r.y1), r.y1], [Xat(r.y2), r.y2]
  ];
  const pts = cand.filter(function (p) {
    return p[0] >= r.x1 - 0.01 && p[0] <= r.x2 + 0.01 &&
           p[1] >= r.y1 - 0.01 && p[1] <= r.y2 + 0.01;
  });
  if (pts.length < 2) return null;
  pts.sort(function (a, b) { return a[0] - b[0] || a[1] - b[1]; });
  const A = pts[0], B = pts[pts.length - 1];
  if (Math.abs(A[0] - B[0]) < 0.01 && Math.abs(A[1] - B[1]) < 0.01) return null;
  return [A[0], A[1], B[0], B[1]];
}

function renderCoordGraph(block, stage) {
  const p = block.params || {};
  const unit = p.unit || 40, ox = 220, oy = 120;
  const slope = p.slope, yIntercept = p.yIntercept;

  if (stage === 3 && block.stage3 === "none") return "";

  let s = '<svg width="100%" viewBox="0 0 420 240" style="margin:6px 0 12px;">';

  // 격자 (연한 회색)
  s += '<g stroke="#eee" stroke-width="1">';
  for (let gy = 40; gy <= 200; gy += 40) {
    if (gy !== oy) s += '<line x1="20" y1="' + gy + '" x2="400" y2="' + gy + '"/>';
  }
  for (let gx = 60; gx <= 380; gx += 40) {
    if (gx !== ox) s += '<line x1="' + gx + '" y1="20" x2="' + gx + '" y2="220"/>';
  }
  s += "</g>";

  // 축 (진한 선) + 축 이름
  s += '<line x1="20" y1="120" x2="405" y2="120" stroke="#333" stroke-width="1.5"/>';
  s += '<line x1="220" y1="18" x2="220" y2="225" stroke="#333" stroke-width="1.5"/>';
  s += '<text x="410" y="124" class="g-txt">x</text><text x="224" y="20" class="g-txt">y</text>';
  s += '<text x="224" y="134" class="g-txt" font-size="10">O</text>';

  // 직선 (포인트 컬러)
  const seg = clipLineToRect(slope, yIntercept, unit, ox, oy, { x1: 20, y1: 18, x2: 405, y2: 240 });
  if (seg) {
    s += '<line x1="' + round1(seg[0]) + '" y1="' + round1(seg[1]) +
         '" x2="' + round1(seg[2]) + '" y2="' + round1(seg[3]) +
         '" stroke="#E8500A" stroke-width="2.5"/>';
  }

  // 라벨 (1단계: 글자 포함 / 2단계: 빈 박스 / 3단계: 없음)
  if (stage < 3) {
    (block.labels || []).forEach(function (lb) {
      let dot = null;
      if (lb.anchor === "y_intercept") dot = [ox, oy - unit * yIntercept];
      if (lb.anchor === "x_intercept" && slope !== 0) dot = [ox + unit * (-yIntercept / slope), oy];
      if (dot) s += '<circle cx="' + round1(dot[0]) + '" cy="' + round1(dot[1]) + '" r="3.5" fill="#E8500A"/>';
      const b = lb.box;
      s += '<rect class="g-label" x="' + b.x + '" y="' + b.y + '" width="' + b.w + '" height="22" rx="3"/>';
      if (stage === 1 || !lb.blank) {
        s += '<text x="' + (b.x + b.w / 2) + '" y="' + (b.y + 15) + '" class="g-txt" text-anchor="middle">' + esc(lb.text) + "</text>";
      }
    });
  }

  s += "</svg>";
  return s;
}

function renderFigure(block, stage) {
  if (block.figure_type === "coord_graph") return renderCoordGraph(block, stage);
  return "";
}

/* ---------- 블록별 렌더링 ---------- */

function renderTextBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (stage === 3) {
    const st3 = block.stage3 || { mode: "lines", lines: 2 };
    if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
    if (st3.mode === "lines") {
      out += '<div class="write-lines">';
      for (let i = 0; i < (st3.lines || 2); i++) out += "<div></div>";
      out += "</div>";
    }
    return out;
  }
  if (h) out += '<div class="qnum">' + renderInline(h, 1, "text") + "</div>";
  out += '<div class="qtext">' + renderInline(block.body, stage, "text") + "</div>";
  return out;
}

function renderFigureBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
  out += renderFigure(block, stage);
  return out;
}

function renderTableBlock(block, stage, opt) {
  let out = "";
  const h = headingFor(block, stage);
  if (h) out += '<div class="qnum"' + (opt.marginTop ? ' style="margin-top:16px;"' : "") + ">" + renderInline(h, 1, "text") + "</div>";
  out += '<table class="def">';
  out += "<tr><th>" + esc(block.columns[0]) + "</th><th>" + esc(block.columns[1]) + "</th></tr>";
  block.rows.forEach(function (row) {
    if (stage === 3) {
      // 용어만 남기고 의미 칸은 비움
      const termPlain = row.term.replace(/\{\{|\}\}/g, "");
      out += '<tr><td class="term" style="height:32px;">' + renderInline(termPlain, 1, "term") + "</td><td></td></tr>";
    } else {
      out += '<tr><td class="term">' + renderInline(row.term, stage, "term") + "</td>" +
             "<td>" + renderInline(row.meaning, stage, "cell") + "</td></tr>";
    }
  });
  out += "</table>";
  return out;
}

/* ---------- 한 장(sheet) 조립 ---------- */

function renderKeywordGrid(keywords) {
  const total = Math.max(8, Math.ceil(keywords.length / 4) * 4);
  let out = '<div class="kw-grid">';
  for (let i = 0; i < total; i++) {
    out += "<div>" + (keywords[i] ? esc(keywords[i]) : "") + "</div>";
  }
  out += "</div>";
  return out;
}

function renderSheet(c, stage) {
  let out = '<div class="sheet">';

  // 머리글: 학년 / 제목 / 로고
  out += '<div class="head">' +
    '<div class="head-grade"><div class="g1">' + esc(c.school) + '</div><div class="g2">' + esc(c.grade) + "</div></div>" +
    '<div class="head-title"><h1>' + STAGE_TITLE[stage] + "</h1></div>" +
    '<div class="head-logo"><div class="logo-badge">더몬스터</div></div>' +
    "</div>";

  // 본문 표: 대단원 / 중단원 / 키워드 / 본문
  out += '<table class="main">';
  out += '<tr><td class="lbl">대단원</td><td class="unit-cell">' + esc(c.unit_big) + "</td></tr>";
  out += '<tr><td class="lbl">중단원</td><td class="unit-cell sub">' + esc(c.unit_mid) + "</td></tr>";
  out += '<tr><td class="lbl">키워드</td><td class="kw-cell">' + renderKeywordGrid(c.keywords) + "</td></tr>";

  out += '<tr><td class="body-lbl">' + (stage === 3 ? "TEST" : "개념") + '</td><td class="body-cell">';
  if (stage === 3) out += '<div class="guide">' + esc(STAGE3_GUIDE) + "</div>";

  let prevWasLines = false;
  c.blocks.forEach(function (block) {
    const opt = { marginTop: stage === 3 && prevWasLines };
    if (block.type === "text") out += renderTextBlock(block, stage, opt);
    else if (block.type === "figure") out += renderFigureBlock(block, stage, opt);
    else if (block.type === "table") out += renderTableBlock(block, stage, opt);
    prevWasLines = stage === 3 && block.type === "text";
  });

  out += "</td></tr></table></div>";
  return out;
}

// 개념 1개 → 3장
function renderConcept(c) {
  return [1, 2, 3].map(function (stage) { return renderSheet(c, stage); }).join("\n");
}

document.getElementById("sheets").innerHTML = renderConcept(EXAMPLE_CONCEPT);
</script>

</body>
</html>
